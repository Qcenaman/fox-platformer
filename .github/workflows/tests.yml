name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node tests/jump-physics.test.js
      - run: node tests/tile-collision.test.js
      - run: node tests/stomp.test.js
      - run: node tests/coin-life.test.js
      - run: node tests/level-parse.test.js
